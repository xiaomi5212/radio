<!DOCTYPE html>
<html lang="zh-CN" data-theme="ember">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<style>html,body{background:#181411;color:#f4efe6}</style>
<title>网络电台 · 在线收听</title>
<meta name="description" content="搜索并在线收听网络电台">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#100e0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="网络电台">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Ccircle%20cx%3D%2216%22%20cy%3D%2216%22%20r%3D%2210%22%20fill%3D%22none%22%20stroke%3D%22%23e8a33d%22%20stroke-width%3D%224%22%2F%3E%3Ccircle%20cx%3D%2216%22%20cy%3D%2216%22%20r%3D%223.4%22%20fill%3D%22%23e8a33d%22%2F%3E%3C%2Fsvg%3E">
<link rel="shortcut icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Ccircle%20cx%3D%2216%22%20cy%3D%2216%22%20r%3D%2210%22%20fill%3D%22none%22%20stroke%3D%22%23e8a33d%22%20stroke-width%3D%224%22%2F%3E%3Ccircle%20cx%3D%2216%22%20cy%3D%2216%22%20r%3D%223.4%22%20fill%3D%22%23e8a33d%22%2F%3E%3C%2Fsvg%3E">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<style>
:root{
  --on-accent:#1a1512;
  --card-shadow:none;
  --r-card:13px;
}
:root[data-theme="ember"]{
  --bg:#100e0c; --bg-soft:#191512; --surface:#1b1714; --surface-hi:#241e19;
  --line:#2d2620; --line-strong:#4a3c2b;
  --text:#f4efe6; --text-2:#e9e2d6; --muted:#9a8f80; --faint:#6f665c;
  --accent:#e8a33d; --accent-wash:rgba(232,163,61,.13);
  --player-bg:#15120f; --toast-bg:#2a231c;
}
:root[data-theme="ocean"]{
  --on-accent:#04121f;
  --bg:#0a0e13; --bg-soft:#111823; --surface:#111823; --surface-hi:#172335;
  --line:#1e2c3f; --line-strong:#2e4a6b;
  --text:#eaf1fa; --text-2:#dce6f2; --muted:#8ba0b8; --faint:#5f7288;
  --accent:#4fa3ff; --accent-wash:rgba(79,163,255,.13);
  --player-bg:#0d141d; --toast-bg:#172435;
}
:root[data-theme="moss"]{
  --on-accent:#06150d;
  --bg:#0c1310; --bg-soft:#121b16; --surface:#131d17; --surface-hi:#1a2720;
  --line:#22322a; --line-strong:#365344;
  --text:#eaf2ec; --text-2:#dbe7df; --muted:#8ea698; --faint:#5f7568;
  --accent:#5fc98d; --accent-wash:rgba(95,201,141,.13);
  --player-bg:#0f1713; --toast-bg:#1a2720;
}
:root[data-theme="paper"]{
  --on-accent:#ffffff;
  --bg:#f4f1ea; --bg-soft:#ffffff; --surface:#ffffff; --surface-hi:#fbf8f2;
  --line:#e5ded3; --line-strong:#cfc2ad;
  --text:#1f1a15; --text-2:#2b241d; --muted:#7c7265; --faint:#a2968a;
  --accent:#c9762a; --accent-wash:rgba(201,118,42,.1);
  --player-bg:#fffdf9; --toast-bg:#2b241d;
  --card-shadow:0 1px 2px rgba(31,26,21,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-bottom:132px;
  transition:background .25s,color .25s;
}
header{
  position:sticky; top:0; z-index:20; background:var(--bg);
  border-bottom:1px solid var(--line);
  padding:16px 18px 14px;
}
.wrap{max-width:1240px;margin:0 auto;position:relative}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.brand-mark{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark svg{width:29px;height:29px;flex:none;stroke:var(--accent)}
.brand-mark h1{margin:0;font-size:18.5px;letter-spacing:-.01em;font-weight:650}
.brand-mark small{color:var(--muted);font-size:11px;letter-spacing:.06em;font-weight:500;margin-left:1px;white-space:nowrap}
.head-actions{display:flex;align-items:center;gap:4px;flex:none}

.icon-btn{
  width:40px;height:40px;border-radius:11px;border:1px solid transparent;
  background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;
  cursor:pointer;position:relative;transition:background .15s,color .15s,border-color .15s;padding:0;
}
.icon-btn:hover{background:var(--surface);color:var(--text);border-color:var(--line)}
.icon-btn svg{width:19px;height:19px}
.icon-btn.active{background:var(--accent-wash);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 38%,transparent)}
.icon-btn .badge{
  position:absolute;top:-1px;right:-3px;min-width:14px;height:14px;padding:0 4px;border-radius:7px;
  background:var(--accent);color:var(--on-accent);font-size:9.5px;line-height:14px;font-weight:700;text-align:center;
  box-shadow:0 0 0 2px var(--bg);
}

.theme-pop{
  position:absolute;right:0;top:50px;z-index:25;width:172px;padding:8px;
  background:var(--surface);border:1px solid var(--line);border-radius:13px;
  box-shadow:0 10px 30px rgba(0,0,0,.18);
}
:root[data-theme="paper"] .theme-pop{box-shadow:0 10px 30px rgba(31,26,21,.12)}
.theme-pop[hidden]{display:none}
.theme-pop button{
  display:flex;align-items:center;gap:9px;width:100%;padding:9px 10px;border:0;border-radius:9px;
  background:transparent;color:var(--text);font-size:13.5px;font-family:inherit;cursor:pointer;text-align:left;
}
.theme-pop button:hover{background:var(--surface-hi)}
.theme-pop button.active{background:var(--accent-wash);color:var(--accent)}
.theme-pop i{width:13px;height:13px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}

.search{
  display:flex;align-items:center;gap:10px;background:var(--bg-soft);
  border:1px solid var(--line);border-radius:12px;padding:0 12px;height:44px;
  transition:border-color .18s,background .18s;
}
.search:focus-within{border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.search svg{width:18px;height:18px;flex:none;color:var(--faint)}
.search input{
  flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);
  font-size:16px;font-family:inherit;height:100%;
}
.search input::placeholder{color:var(--faint)}
.clear{
  display:none;flex:none;border:0;background:none;color:var(--muted);cursor:pointer;
  font-size:13px;padding:6px;line-height:1;border-radius:8px;
}
.clear:hover{color:var(--text)}
.clear.show{display:block}
main{max-width:1240px;margin:0 auto;padding:18px 18px 0}
.list-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.list-head h2{margin:0;font-size:14.5px;font-weight:600;color:var(--text-2);letter-spacing:.01em}
.lh-left{display:flex;align-items:baseline;min-width:0;flex-wrap:wrap}
.count{font-size:12.5px;color:var(--muted);flex:none}
.hint{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:400;color:var(--muted);margin-left:10px;vertical-align:1px}
.hint i{width:5px;height:5px;border-radius:50%;background:var(--accent);animation:pulse 1.5s ease-in-out infinite}
.hint[hidden]{display:none}
.grid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:560px){.grid{grid-template-columns:repeat(2,1fr);gap:12px}}
@media(min-width:980px){.grid{grid-template-columns:repeat(3,1fr);gap:14px}}
@media(min-width:1420px){.grid{grid-template-columns:repeat(4,1fr)}}

.seg{display:inline-flex;gap:2px;padding:3px;margin:0 0 14px;border:1px solid var(--line);
  border-radius:999px;background:var(--surface)}
.seg button{padding:7px 16px;border:0;border-radius:999px;background:transparent;color:var(--muted);
  font:inherit;font-size:13px;cursor:pointer;transition:background .16s,color .16s}
.seg button.active{background:var(--accent-wash);color:var(--accent)}
.seg button:hover{color:var(--text)}

.lh-right{display:flex;align-items:center;gap:12px}
.mini-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);color:var(--muted);font:inherit;font-size:12px;
  cursor:pointer;transition:color .16s,border-color .16s}
.mini-btn:hover{color:var(--accent);border-color:var(--accent)}
.mini-btn.playing{color:var(--accent);border-color:var(--accent);background:var(--accent-wash)}
.more-btn{width:100%;padding:12px;margin-top:10px;border:1px dashed var(--line-strong);border-radius:14px;
  background:transparent;color:var(--muted);font:inherit;font-size:13px;cursor:pointer}
.more-btn:hover{color:var(--text);border-color:var(--accent)}

.blog-list{display:flex;flex-direction:column;gap:8px}
.ep{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);
  border-radius:14px;background:var(--surface);cursor:pointer;transition:border-color .16s,background .16s}
.ep:hover{border-color:var(--line-strong)}
.ep-art{width:52px;height:52px;flex:none;border-radius:10px;overflow:hidden;background:var(--surface-2);
  display:grid;place-items:center;color:var(--muted);font-size:16px}
.ep-art img{width:100%;height:100%;object-fit:cover;display:block}
.ep-info{min-width:0;flex:1}
.ep-name{margin:0;font-size:15px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden}
.ep-meta{margin:4px 0 0;font-size:12px;color:var(--muted)}
.ep-btn{width:36px;height:36px;flex:none;border-radius:50%;border:1px solid var(--line);
  background:transparent;color:var(--muted);display:grid;place-items:center}
.ep.playing .ep-btn{color:var(--accent);border-color:var(--accent)}
.ep.playing .ep-name{color:var(--accent)}

.chips{display:flex;gap:8px;overflow-x:auto;margin:0 0 12px;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  color:var(--muted);font:inherit;font-size:13px;cursor:pointer;transition:background .16s,color .16s,border-color .16s}
.chip:hover{color:var(--text);border-color:var(--line-strong)}
.chip.active{background:var(--accent-wash);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}

.resume{margin-bottom:14px}
.resume-card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:inherit;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:10px 12px;cursor:pointer;
  transition:background .18s,border-color .18s}
.resume-card:hover{background:var(--surface-2);border-color:var(--line-strong)}
.resume-card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.resume-art{width:40px;height:40px;flex:none;border-radius:calc(var(--r-card) - 4px);overflow:hidden;background:var(--surface-2);
  display:grid;place-items:center;color:var(--muted);font-size:16px;font-weight:600}
.resume-art img{width:100%;height:100%;object-fit:cover}
.resume-info{flex:1;min-width:0}
.resume-name{margin:0;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.resume-meta{margin-top:2px;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.resume-go{flex:none;display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--accent)}
@media (max-width:520px){ .resume-go{display:none} }
.card.dead{opacity:.62}
.card.dead .name::after{content:" · 上次不可用";font-size:11px;font-weight:400;color:var(--muted)}

.card{
  display:flex;align-items:center;gap:12px;width:100%;min-width:0;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);
  padding:10px 12px;cursor:pointer;text-align:left;color:inherit;font-family:inherit;
  box-shadow:var(--card-shadow);
  transition:background .16s,border-color .16s;
}
.card:hover{background:var(--surface-hi);border-color:var(--line-strong)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card.active{background:var(--accent-wash);border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
.art{
  width:46px;height:46px;flex:none;border-radius:11px;overflow:hidden;
  background:linear-gradient(155deg,var(--surface-hi),var(--bg-soft));
  box-shadow:inset 0 0 0 1px var(--line);
  display:flex;align-items:center;justify-content:center;
  color:var(--muted);font-size:16px;font-weight:600;
}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.info{min-width:0;flex:1}
.name{
  font-size:14.5px;font-weight:560;line-height:1.4;margin:0 0 3px;color:var(--text);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.meta{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{
  display:inline-block;padding:1px 6px;border:1px solid var(--line);border-radius:5px;
  font-size:11px;color:var(--muted);margin-right:5px;vertical-align:1px;
}
.fav-btn{
  width:38px;height:38px;flex:none;border:0;border-radius:9px;background:transparent;
  color:var(--faint);display:flex;align-items:center;justify-content:center;
  cursor:pointer;padding:0;transition:color .15s,background .15s;
}
.fav-btn svg{width:17px;height:17px}
.fav-btn:hover{color:var(--accent);background:var(--accent-wash)}
.fav-btn.on{color:var(--accent)}
.fav-btn.on svg path{fill:currentColor}
.status-icon{flex:none;width:24px;display:flex;align-items:center;justify-content:center;color:var(--faint)}
.card.active .status-icon{color:var(--accent)}
.bars{display:flex;align-items:flex-end;gap:2px;height:15px}
.bars i{width:3px;background:var(--accent);border-radius:2px;animation:eq 1s ease-in-out infinite}
.bars i:nth-child(1){height:8px;animation-delay:-.2s}
.bars i:nth-child(2){height:14px;animation-delay:-.5s}
.bars i:nth-child(3){height:10px;animation-delay:-.8s}
.bars.paused i{animation-play-state:paused;opacity:.55}
@keyframes eq{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}
.play-tri{width:0;height:0;border-left:8px solid currentColor;border-top:6px solid transparent;border-bottom:6px solid transparent;margin-left:2px;opacity:.6}

.state{padding:56px 8px;text-align:center;color:var(--muted);font-size:13.5px;line-height:1.9}
.state b{display:block;color:var(--text);font-size:15px;margin-bottom:6px;font-weight:560}

.player{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:var(--player-bg);border-top:1px solid var(--line);
  padding:9px 16px calc(9px + env(safe-area-inset-bottom));
}
.player-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:10px}
.np{display:flex;align-items:center;gap:11px;min-width:0;flex:1}
.np-art{
  width:42px;height:42px;border-radius:10px;overflow:hidden;flex:none;
  background:linear-gradient(155deg,var(--surface-hi),var(--bg-soft));
  box-shadow:inset 0 0 0 1px var(--line);
  display:flex;align-items:center;justify-content:center;
  color:var(--muted);font-size:15px;font-weight:600;
}
.np-art img{width:100%;height:100%;object-fit:cover}
.np-text{min-width:0}
.np-name{font-size:14px;font-weight:560;margin:0 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.np-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0}
.live{display:none;align-items:center;gap:5px;font-size:11px;color:var(--accent);letter-spacing:.06em;flex:none}
.live.show{display:flex}
.live i{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.ctrl{display:flex;align-items:center;gap:6px;flex:none}
.vol{display:none;align-items:center;gap:7px;color:var(--muted);margin-right:2px}
@media(min-width:560px){.vol{display:flex}}
.vol svg{width:16px;height:16px}
.vol input{width:74px;accent-color:var(--accent);height:18px}
.btn-play{
  width:44px;height:44px;border-radius:50%;border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));
  background:var(--surface);color:var(--text);display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex:none;transition:background .15s,border-color .15s,color .15s;
}
.btn-play:hover:not(:disabled){background:var(--accent-wash);color:var(--accent);border-color:var(--accent)}
.btn-play:disabled{opacity:.4;cursor:default}
.btn-play svg{width:19px;height:19px}

.toast{
  position:fixed;left:50%;bottom:100px;transform:translate(-50%,8px);
  background:var(--toast-bg);border:1px solid var(--line-strong);color:#f0e7d9;
  padding:9px 15px;border-radius:10px;font-size:13px;max-width:86vw;text-align:center;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:40;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
:root[data-theme="paper"] .toast{color:#fbf8f2}
@media(prefers-reduced-motion:reduce){
  .bars i,.hint i,.live i{animation:none}
  *{transition:none!important}
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="16" cy="18" r="6.5"/>
          <path d="M19.5 13.5L25 7"/>
          <path d="M9 12c-3.5 3.5-3.5 9.5 0 13M23 12c3.5 3.5 3.5 9.5 0 13" stroke-opacity=".45"/>
        </svg>
        <h1>网络电台</h1>
        <small>Live Radio</small>
      </div>
      <div class="head-actions">
        <button class="icon-btn" id="favBtn" type="button" aria-pressed="false" aria-label="只看收藏">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
            <path d="M12 20.2l-1.1-1C6 14.7 3.3 12.2 3.3 9.4A4.6 4.6 0 0112 7.1a4.6 4.6 0 018.7 2.3c0 2.8-2.7 5.3-7.6 9.8z"/>
          </svg>
          <span class="badge" id="favCount">0</span>
        </button>
        <button class="icon-btn" id="themeBtn" type="button" aria-expanded="false" aria-label="切换配色">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
            <circle cx="12" cy="12" r="8.5"/>
            <path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor" stroke="none" opacity=".85"/>
          </svg>
        </button>
        <button class="icon-btn" id="sleepBtn" type="button" aria-expanded="false" aria-label="睡眠定时" title="睡眠定时">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
            <circle cx="12" cy="13" r="7"/>
            <path d="M12 9.4V13l2.6 1.8"/>
            <path d="M7.6 5.4 5.4 7.4M16.4 5.4l2.2 2"/>
            <path d="M6.3 19.4 4.4 21.2M17.7 19.4l1.9 1.8"/>
          </svg>
          <span class="badge" id="sleepBadge" hidden></span>
        </button>
      </div>
      <div class="theme-pop" id="sleepPop" hidden>
        <button type="button" data-min="0">关闭定时</button>
        <button type="button" data-min="15">15 分钟后停止</button>
        <button type="button" data-min="30">30 分钟后停止</button>
        <button type="button" data-min="60">60 分钟后停止</button>
        <button type="button" data-min="90">90 分钟后停止</button>

const HEART_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M12 20.2l-1.1-1C6 14.7 3.3 12.2 3.3 9.4A4.6 4.6 0 0112 7.1a4.6 4.6 0 018.7 2.3c0 2.8-2.7 5.3-7.6 9.8z"/></svg>';
const favBtn = document.getElementById('favBtn');
const favCount = document.getElementById('favCount');
const npFav = document.getElementById('npFav');

let favs = (function(){
  try{
    const arr = JSON.parse(localStorage.getItem(FAV_KEY) || '[]');
    return Array.isArray(arr) ? arr.filter(function(x){ return x && x.url && x.name; }) : [];
  }catch(e){ return []; }
})();
let favOnly = false;

function isFav(s){ return !!s && favs.some(function(f){ return f.url === s.url; }); }

function saveFavs(){
  try{ localStorage.setItem(FAV_KEY, JSON.stringify(favs)); }catch(e){}
}

function updateFavMarks(){
  favCount.textContent = favs.length;
  favBtn.classList.toggle('active', favOnly);
  favBtn.setAttribute('aria-pressed', String(favOnly));
  elMap.forEach(function(v, url){
    const on = favs.some(function(f){ return f.url === url; });
    v.heart.classList.toggle('on', on);
    v.heart.setAttribute('aria-pressed', String(on));
    v.heart.setAttribute('aria-label', (on ? '取消收藏 ' : '收藏 ') + v.name);
  });
  npFav.disabled = !current;
  if (current){
    const on = isFav(current);
    npFav.classList.toggle('on', on);
    npFav.setAttribute('aria-pressed', String(on));
    npFav.setAttribute('aria-label', (on ? '取消收藏 ' : '收藏') + '当前电台');
  }
}

function toggleFav(s){
  if (!s) return;
  if (isFav(s)){
    favs = favs.filter(function(f){ return f.url !== s.url; });
  } else {
    favs.unshift({ name:s.name, url:s.url, fav:s.fav, country:s.country, tag:s.tag, hls:s.hls, clicks:s.clicks });
  }
  saveFavs();
  if (favOnly) renderFavs();
  else updateFavMarks();
}

/* ===== 工具 ===== */
let toastTimer = null;
function toast(msg, ms){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>toastEl.classList.remove('show'), ms || 2600);
}

function norm(raw){
  const url = raw.url_resolved || raw.url || raw.u || '';
  if (!String(url).startsWith('https://')) return null;
  const hlsFlag = raw.h ? 1 : (raw.hls === 1 || String(url).split('?')[0].endsWith('.m3u8') ? 1 : 0);
  let fav = raw.f || raw.favicon || '';
  if (!String(fav).startsWith('https://')) fav = '';
  return {
    name: String(raw.n || raw.name || '').trim(),
    url: String(url).trim(),
    fav: fav.trim(),
    country: raw.c || raw.country || '',
    tag: (raw.t || (raw.tags || '').split(',')[0] || '').trim(),
    hls: hlsFlag,
    clicks: raw.k || raw.clickcount || 0
  };
}

function isHidden(s){
  return HIDE_STATIONS.some(function(k){
    if (!k) return false;
    var key = String(k).trim();
    if (!key) return false;
    return s.url === key || s.name.indexOf(key) >= 0;
  });
}

/* 同名多台合并成一条，多余的播放地址留作备用线路 */
function dedupe(list){
  const seen = new Map();
  const out = [];
  for (const s of list){
    if (!s || !s.name || !s.url) continue;
    if (isHidden(s)) continue;
    const key = s.name.toLowerCase();
    if (seen.has(key)){
      const first = seen.get(key);
      if (s.url !== first.url && first.alts.indexOf(s.url) < 0 && first.alts.length < 3) first.alts.push(s.url);
      continue;
    }
    s.alts = Array.isArray(s.alts) ? s.alts.slice() : [];
    seen.set(key, s);
    out.push(s);
  }
  return out;
}

/* 把自己配置的电台放到列表最前面（同名或同地址的会被去掉，避免重复） */
function mineStations(){
  return MY_STATIONS.map(norm).filter(Boolean);
}

function mergeMine(list){
  const mine = mineStations();
  if (!mine.length) return list;
  return mine.concat(list.filter(s => !mine.some(m => m.url === s.url)));
}

function metaText(s){
  if (s.podcast) return { c: s.country || '', t: s.tag || '' };
  const c = COUNTRY[s.country] || s.country || '';
  const t = TAG[s.tag] || '';
  return { c, t };
}

function letterOf(s){
  const ch = s.name.replace(/[^\u4e00-\u9fa5A-Za-z0-9]/g,'').charAt(0);
  return ch ? ch.toUpperCase() : '♪';
}

/* ===== 渲染 ===== */
const FILTERS = [
  { k:'',        label:'全部' },
  { k:'music',   label:'音乐', tags:['music','pop','classical','ambient','oldies','jazz','rock','dance','electronic','hits','chill','音乐','流行','金曲','古典','轻音乐','爵士'] },
  { k:'news',    label:'新闻', tags:['news','information','新闻','资讯','交通','综合'] },
  { k:'story',   label:'故事', tags:['storytelling','crosstalk','comedy','spoken','audiobook','故事','评书','相声','曲艺'] },
  { k:'finance', label:'财经', tags:['economics','business','financial','财经','经济'] },
  { k:'tv',      label:'伴音', tags:['tv','电视'] }
];
let filterKey = '';

function chipMatch(s){
  const f = FILTERS.find(function(x){ return x.k === filterKey; });
  if (!f || !f.tags) return true;
  const t = (s.tag || '').toLowerCase();
  return f.tags.some(function(x){ return t.indexOf(x) >= 0; });
}
function filterLabel(){
  const f = FILTERS.find(function(x){ return x.k === filterKey; });
  return (f && f.k) ? f.label : '热门中文电台';
}

function render(list){
  if (filterKey) list = list.filter(chipMatch);
  stations = list;
  elMap = new Map();
  grid.innerHTML = '';
  countEl.textContent = list.length ? '共 ' + list.length + ' 台' : '';
  if (!list.length){
    showState('没有找到电台', '换一个关键词试试，比如「音乐」「新闻」「上海」');
    return;
  }
  hideState();
  const frag = document.createDocumentFragment();
  for (const s of list){
    const card = document.createElement('div');
    card.className = 'card';
    card.setAttribute('role', 'button');
    card.setAttribute('tabindex', '0');
    card.setAttribute('aria-label', '播放 ' + s.name);

    const art = document.createElement('div');
    art.className = 'art';
    if (s.fav){
      const img = document.createElement('img');
      img.referrerPolicy = 'no-referrer';
      img.loading = 'lazy';
      img.alt = '';
      img.src = s.fav;
      img.onerror = function(){ img.remove(); art.textContent = letterOf(s); };
      art.appendChild(img);
    } else {
      art.textContent = letterOf(s);
    }

    const info = document.createElement('div');
    info.className = 'info';
    const name = document.createElement('p');
    name.className = 'name';
    name.textContent = s.name;
    const meta = document.createElement('div');
    meta.className = 'meta';
    const m = metaText(s);
    if (isFailed(s.url)) card.classList.add('dead');
    if (m.c) meta.appendChild(tagSpan(m.c));
    if (m.t) meta.appendChild(tagSpan(m.t));
    if (s.hls){
      const rest = document.createElement('span');
      rest.textContent = (m.c || m.t) ? '· HLS' : 'HLS 直播流';
      meta.appendChild(rest);
    }
    if (!m.c && !m.t && !s.hls) meta.textContent = '电台';
    info.appendChild(name);
    info.appendChild(meta);

    const heart = document.createElement('button');
    heart.type = 'button';
    heart.className = 'fav-btn' + (isFav(s) ? ' on' : '');
    heart.innerHTML = HEART_SVG;
    heart.setAttribute('aria-label', (isFav(s) ? '取消收藏 ' : '收藏 ') + s.name);
    heart.setAttribute('aria-pressed', String(isFav(s)));
    heart.addEventListener('click', function(ev){ ev.stopPropagation(); toggleFav(s); });

    const icon = document.createElement('span');
    icon.className = 'status-icon';
    icon.innerHTML = '<span class="play-tri"></span>';

    card.appendChild(art);
    card.appendChild(info);
    card.appendChild(heart);
    card.appendChild(icon);
    card.addEventListener('click', function(){ resetRandUI(); play(s); });
    card.addEventListener('keydown', function(ev){
      if (ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); resetRandUI(); play(s); }
    });
    elMap.set(s.url, { card, icon, heart, name: s.name });
    frag.appendChild(card);
  }
  grid.appendChild(frag);
  fixOrphans();
  updateFavMarks();
  syncActive();
}

function renderFavs(){
  renderResume();
  listTitle.textContent = '我的收藏';
  setHint(false);
  const visible = favs.filter(function(s){ return !isHidden(s); });
  if (!visible.length){
    grid.innerHTML = '';
    elMap = new Map();
    countEl.textContent = '';
    showState('还没有收藏', '点电台卡片右侧的爱心，收藏会保存在这台设备上');
    updateFavMarks();
    return;
  }
  render(visible.slice());
}

function fixOrphans(){
  const cards = [...grid.children];
  cards.forEach(c=>{ c.style.gridColumn = ''; });
  if (cards.length < 5) return;
  const cols = (getComputedStyle(grid).gridTemplateColumns || '').split(' ').filter(Boolean).length;
  if (cols > 1 && cards.length % cols === 1){
    cards[cards.length - 1].style.gridColumn = '1 / -1';
  }
}
window.addEventListener('resize', function(){ if (stations.length) fixOrphans(); });

function tagSpan(text){
  const sp = document.createElement('span');
  sp.className = 'tag';
  sp.textContent = text;
  return sp;
}

function showState(title, sub){
  stateEl.hidden = false;
  stateEl.innerHTML = '';
  const b = document.createElement('b');
  b.textContent = title;
  stateEl.appendChild(b);
  stateEl.appendChild(document.createTextNode(sub || ''));
}

function hideState(){ stateEl.hidden = true; }

/* ===== 播放 ===== */
function teardown(){
  if (hls){ try{ hls.destroy(); }catch(e){} hls = null; }
  audio.pause();
  audio.removeAttribute('src');
  try{ audio.load(); }catch(e){}
}

function syncActive(){
  elMap.forEach((v)=>{
    v.card.classList.remove('active');
    v.icon.innerHTML = '<span class="play-tri"></span>';
  });
  if (current && elMap.has(current.url)){
    const v = elMap.get(current.url);
    v.card.classList.add('active');
    v.icon.innerHTML = '<span class="bars' + (audio.paused ? ' paused' : '') + '"><i></i><i></i><i></i></span>';
  }
}

function setPlayerUI(playing){
  playIcon.innerHTML = playing ? ICON_PAUSE : ICON_PLAY;
  liveEl.classList.toggle('show', playing);
  syncActive();
}

function setNowPlaying(s){
  npName.textContent = s ? s.name : '未在播放';
  const m = s ? metaText(s) : null;
  npSub.textContent = s ? ([m.c, m.t].filter(Boolean).join(' · ') || '在线收听') : '选择任意一台电台开始收听';
  npArt.innerHTML = '';
  if (s && s.fav){
    const img = document.createElement('img');
    img.referrerPolicy = 'no-referrer';
    img.alt = '';
    img.src = s.fav;
    img.onerror = function(){ img.remove(); npArt.textContent = letterOf(s); };
    npArt.appendChild(img);
  } else {
    npArt.textContent = s ? letterOf(s) : '♪';
  }
  updateFavMarks();
}

function loadScript(src){
  return new Promise((res, rej)=>{
    const sc = document.createElement('script');
    sc.src = src;
    sc.onload = res;
    sc.onerror = ()=>rej(new Error('load fail'));
    document.head.appendChild(sc);
  });
}

async function ensureHls(){
  if (window.Hls) return true;
  try{
    await loadScript('https://fastly.jsdelivr.net/npm/hls.js@1/dist/hls.min.js');
    return !!window.Hls;
  }catch(e){
    return false;
  }
}

let stallTimer = null;

function fail(msg){
  clearTimeout(stallTimer);
  if (current && Array.isArray(current.alts) && current.alts.length){
    const next = current.alts.shift();
    const alt = Object.assign({}, current, { url: next, alts: current.alts, baseUrl: current.baseUrl || current.url });
    current = alt;
    toast('这条线路播不了，正在尝试备用地址…');
    startStream(alt);
    return;
  }
  if (current) markFailed(current.baseUrl || current.url);
  teardown();
  current = null;
  setNowPlaying(null);
  playBtn.disabled = true;
  setPlayerUI(false);
  toast(msg);
}

/* 暂停超过这个时间，恢复时重新连接直播（否则会接到过期缓冲，出现“显示播放却没声音”） */
const RECONNECT_AFTER_MS = 5000;
let pausedAt = 0;        // 最近一次暂停的时间戳
let wantPlaying = false; // 用户是否希望持续播放
let frozenTicks = 0;     // 播放中音频时间不前进的连续次数
let autoRetries = 0;     // 自动重连次数，避免死循环

async function startStream(s){
  teardown();
  setNowPlaying(s);
  npSub.textContent = '正在连接…';
  playBtn.disabled = false;
  setPlayerUI(false);

  try{
    if (s.hls){
      if (audio.canPlayType('application/vnd.apple.mpegurl')){
        audio.src = s.url;
      } else {
        const ok = await ensureHls();
        if (!ok){ fail('HLS 播放组件加载失败，请检查网络后重试'); return; }
        hls = new window.Hls({ enableWorker:true, backBufferLength:30 });
        hls.loadSource(s.url);
        hls.attachMedia(audio);
        hls.on(window.Hls.Events.ERROR, function(evt, data){
          if (data && data.fatal) fail('该电台暂时无法播放，换一台试试');
        });
      }
    } else {
      audio.src = s.url;
    }
    await audio.play();
    wantPlaying = true;
    pausedAt = 0;
    clearTimeout(stallTimer);
    stallTimer = setTimeout(function(){
      if (current && current.url === s.url && audio.currentTime === 0){
        fail('这台电台暂时连不上，换一台试试');
      }
    }, 16000);
  }catch(err){
    if (err && err.name === 'NotAllowedError'){
      npSub.textContent = '点击播放按钮开始收听';
      toast('浏览器已阻止自动播放，请点右下角播放按钮');
      return;
    }
    if (err && err.name === 'AbortError') return;
    fail('该电台暂时无法播放，换一台试试');
  }
}

function resumeOrReconnect(){
  if (!current) return;
  const stale = !pausedAt || (Date.now() - pausedAt > RECONNECT_AFTER_MS);
  if (!stale && audio.getAttribute('src')){
    audio.play().then(function(){
      wantPlaying = true;
      pausedAt = 0;
    }).catch(function(){ startStream(current); });
    return;
  }
  npSub.textContent = '重新连接直播…';
  startStream(current);
}

async function play(s){
  // 点同一台：在播放/暂停之间切换
  if (current && current.url === s.url){
    if (!audio.paused){
      wantPlaying = false;
      audio.pause();
      return;
    }
    resumeOrReconnect();
    return;
  }
  current = s;
  await startStream(s);
}

audio.addEventListener('playing', ()=>{
  if (!current) return;
  clearTimeout(stallTimer);
  pausedAt = 0;
  wantPlaying = true;
  frozenTicks = 0;
  autoRetries = 0;
  toastEl.classList.remove('show');
  const m = metaText(current);
  npSub.textContent = ([m.c, m.t].filter(Boolean).join(' · ') || '在线收听') + ' · 已开始播放';
  playBtn.disabled = false;
  setPlayerUI(true);
  remember(current);
  renderResume();
  updateMediaSession(current);
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
});
audio.addEventListener('pause', ()=>{
  setPlayerUI(false);
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
  if (current && audio.currentTime > 0){
    pausedAt = Date.now();
    wantPlaying = false;
    const m = metaText(current);
    npSub.textContent = ([m.c, m.t].filter(Boolean).join(' · ') || '在线收听') + ' · 已暂停';
  }
});
audio.addEventListener('waiting', ()=>{
  if (current) npSub.textContent = '缓冲中…';
});
audio.addEventListener('error', ()=>{
  // 清空 src 时会触发 emptied，此时不应判定为播放失败
  if (!current) return;
  if (!audio.getAttribute('src') && !hls) return;
  fail('该电台暂时无法播放，换一台试试');
});

favBtn.addEventListener('click', function(){
  favOnly = !favOnly;
  if (favOnly) setView('radio');
  if (favOnly){
    input.value = '';
    clearBtn.classList.remove('show');
    lastQuery = '';
    clearTimeout(searchTimer);
    renderFavs();
  } else {
    loadDefault();
  }
  updateFavMarks();
});

npFav.addEventListener('click', function(){
  if (current) toggleFav(current);
});

playBtn.addEventListener('click', ()=>{
  if (!current) return;
  if (audio.paused){
    resumeOrReconnect();
  } else {
    wantPlaying = false;
    audio.pause();
  }
});

/* 卡死看门狗：显示在播放但音频 15 秒不前进，自动重连一次 */
setInterval(function(){
  if (!current || !wantPlaying || audio.paused){ frozenTicks = 0; return; }
  if (audio.currentTime > 0 && audio.currentTime !== lastTickTime){
    lastTickTime = audio.currentTime;
    frozenTicks = 0;
    return;
  }
  frozenTicks++;
  if (frozenTicks >= 3){
    frozenTicks = 0;
    if (autoRetries < 2){
      autoRetries++;
      startStream(current);
    } else {
      fail('这台电台似乎已断开，换一台试试');
    }
  }
}, 5000);
let lastTickTime = 0;

/* 从后台切回来时，如果本该在播放却被系统暂停了，补一次 */
document.addEventListener('visibilitychange', function(){
  if (document.hidden || !current || !wantPlaying) return;
  if (audio.paused) resumeOrReconnect();
});

/* ===== 数据加载 ===== */
function apiOne(host, path){
  return new Promise(function(resolve, reject){
    const ctrl = new AbortController();
    const timer = setTimeout(function(){ ctrl.abort(); reject(new Error('timeout')); }, 22000);
    fetch(host + path, { signal: ctrl.signal, headers: { 'User-Agent': 'radio-web-demo' } })
      .then(function(res){
        if (!res.ok) throw new Error('bad status');
        return res.json();
      })
      .then(function(data){
        clearTimeout(timer);
        if (Array.isArray(data) && data.length) resolve(data); else throw new Error('empty');
      })
      .catch(function(e){ clearTimeout(timer); reject(e); });
  });
}

/* 顺序请求镜像：一次只用一个通道，失败再换下一个（并发会互相抢带宽，反而更慢） */
async function api(path){
  const deadline = Date.now() + 18000;
  for (const host of HOSTS){
    const left = deadline - Date.now();
    if (left < 1500) break;
    try{
      const ctrl = new AbortController();
      const timer = setTimeout(function(){ ctrl.abort(); }, Math.min(12000, left));
      const res = await fetch(host + path, { signal: ctrl.signal, headers: { 'User-Agent': 'radio-web-demo' } });
      clearTimeout(timer);
      if (!res.ok) continue;
      const data = await res.json();
      if (Array.isArray(data) && data.length) return data;
    }catch(e){ /* 换下一个镜像 */ }
  }
  return null;
}

const CACHE_KEY = 'radio_cache_v1';
const CACHE_TTL = 24 * 3600 * 1000;
function readCache(){
  try{
    const c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
    if (c && Array.isArray(c.list) && Date.now() - c.t < CACHE_TTL && c.list.length) return c.list;
  }catch(e){}
  return null;
}
function writeCache(list){
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), list: list })); }catch(e){}
}

function setHint(on){
  const el = document.getElementById('hint');
  if (el) el.hidden = !on;
}

let fullRetry = 0;

/* 先读自己仓库里的静态列表（快、稳），拿不到再走线上接口 */
async function fetchStations(){
  try{
    const res = await fetch('stations.json', { cache: 'no-cache' });
    if (res.ok){
      const d = await res.json();
      const arr = Array.isArray(d) ? d : (d && Array.isArray(d.list) ? d.list : null);
      if (arr && arr.length) return arr;
    }
  }catch(e){}
  return api('/json/stations/search?limit=200&hidebroken=true&order=clickcount&reverse=true&countrycode=CN');
}

async function loadDefault(){
  if (loading) return;
  const cached = readCache();
  if (cached && !bootCache){
    pool = mergeMine(cached);
    render(pool);
    renderResume();
  }
  loading = true;
  listTitle.textContent = filterLabel();
  if (!cached) setHint(true);
  let raw = null;
  try{
    raw = await fetchStations();
  }finally{
    loading = false;
    setHint(false);
  }
  if (!raw){
    if (!cached){
      pool = mergeMine(dedupe(SEED.map(norm)));
      render(pool);
      renderResume();
      toast('在线数据暂时连不上，已显示内置电台');
    }
    return;
  }
  const clean = dedupe(raw.map(norm).filter(Boolean)).sort((a,b)=>b.clicks - a.clicks);
  if (clean.length){
    pool = mergeMine(clean);
    render(pool);
    renderResume();
    writeCache(clean);
  } else if (!cached){
    pool = mergeMine(dedupe(SEED.map(norm)));
    render(pool);
    renderResume();
  }
}

async function doSearch(q){
  if (favOnly) return;
  listTitle.textContent = '搜索「' + q + '」';
  setHint(false);
  const ql = q.toLowerCase();

  // 第一步：本地池立即出结果，不用等网络
  const local = pool.filter(function(s){ return s.name.toLowerCase().indexOf(ql) >= 0; });
  if (local.length) render(local);
  else showState('正在搜索…', '正在从在线电台库查找');

  // 第二步：在线补全（回来时确认用户没有改词、没切到收藏）
  const raw = await api('/json/stations/search?name=' + encodeURIComponent(q) + '&limit=80&hidebroken=true&order=clickcount&reverse=true');
  if (favOnly || input.value.trim() !== q) return;
  let list = raw ? dedupe(raw.map(norm).filter(Boolean)).sort((a,b)=>b.clicks - a.clicks) : [];
  const mineHit = mineStations().filter(function(s){ return s.name.toLowerCase().indexOf(ql) >= 0; });
  if (mineHit.length) list = mineHit.concat(list.filter(function(s){ return !mineHit.some(function(m){ return m.url === s.url; }); }));
  if (!list.length && !raw){
    list = local.length ? local : pool.filter(function(s){ return s.name.toLowerCase().indexOf(ql) >= 0; });
  }
  render(list);
}

/* ===== 搜索交互 ===== */
let searchTimer = null;
let lastQuery = '';
input.addEventListener('input', ()=>{
  const q = input.value.trim();
  clearBtn.classList.toggle('show', !!q);
  if (view === 'blog'){ clearTimeout(searchTimer); blogLimit = 10; renderBlog(); return; }
  clearTimeout(searchTimer);
  renderResume();

  // 本地先出结果：不等网络，输入即响应
  if (favOnly){ favOnly = false; updateFavMarks(); }
  if (q){
    const ql = q.toLowerCase();
    const local = pool.filter(function(s){ return s.name.toLowerCase().indexOf(ql) >= 0; });
    listTitle.textContent = '搜索「' + q + '」';
    if (local.length) render(local);
    else showState('正在搜索…', '正在从在线电台库查找');
  } else {
    lastQuery = '';
    listTitle.textContent = filterLabel();
    if (pool.length) render(pool);
  }

  if (q === lastQuery) return;
  searchTimer = setTimeout(()=>{
    lastQuery = q;
    if (!q) loadDefault();
    else doSearch(q);
  }, 420);
});
clearBtn.addEventListener('click', ()=>{
  input.value = '';
  clearBtn.classList.remove('show');
  if (view === 'blog'){ blogLimit = 10; renderBlog(); return; }
  lastQuery = '';
  clearTimeout(searchTimer);
  input.focus();
  loadDefault();
});

/* ===== 人文故事（播客） ===== */
let view = 'radio', blogData = null, blogShow = 'all';
const seg = document.getElementById('seg');
const radioView = document.getElementById('radioView');
const blogView = document.getElementById('blogView');
const blogList = document.getElementById('blogList');
const blogChips = document.getElementById('blogChips');
const blogState = document.getElementById('blogState');
const blogCount = document.getElementById('blogCount');
const blogTitle = document.getElementById('blogTitle');

function setView(v){
  view = v;
  seg.querySelectorAll('button').forEach(function(b){
    const on = b.dataset.view === v;
    b.classList.toggle('active', on);
    b.setAttribute('aria-selected', String(on));
  });
  radioView.hidden = v !== 'radio';
  blogView.hidden = v !== 'blog';
  input.placeholder = v === 'blog' ? '搜索节目名称' : '搜索电台名称';
  if (v === 'blog'){
    if (blogData) renderBlog(); else loadBlog();
  }else{
    renderResume();
  }
}
seg.addEventListener('click', function(ev){
  const b = ev.target.closest('button');
  if (b) setView(b.dataset.view);
});

async function loadBlog(){
  try{
    const res = await fetch('blog.json', { cache: 'no-cache' });
    if (!res.ok) throw new Error('bad status');
    blogData = await res.json();
    renderBlog();
  }catch(e){
    blogState.hidden = false;
    blogState.innerHTML = '<p>节目单加载失败</p><small>请稍后刷新页面</small>';
  }
}

let blogLimit = 10;
let randomEp = null;

function playEpisode(ep, card, keepRandom){
  blogList.querySelectorAll('.ep').forEach(function(c){ c.classList.remove('playing'); });
  if (card) card.classList.add('playing');
  if (!keepRandom){
    randomEp = null;
    const sb = document.getElementById('shuffleBtn');
    if (sb){ sb.classList.remove('playing'); }
    const sl = document.getElementById('shuffleLabel');
    if (sl) sl.textContent = '随机播放';
  }
  play({ name: ep.title, url: ep.audio, country: ep.show, tag: ep.date, hls: 0, podcast: true });
}

function flattenEpisodes(){
  const list = [];
  (blogData ? blogData.shows : []).forEach(function(sh){
    if (blogShow !== 'all' && sh.id !== blogShow) return;
    sh.episodes.forEach(function(ep){
      list.push({ title: ep.title, date: ep.date, audio: ep.audio, duration: ep.duration,
                  cover: ep.cover || sh.cover, show: sh.name });
    });
  });
  list.sort(function(a, b){ return (b.date || '').localeCompare(a.date || ''); });
  return list;
}

function makeEpCard(ep, isRandom){
  const card = document.createElement('div');
  card.className = 'ep';
  card.setAttribute('role', 'button');
  card.setAttribute('tabindex', '0');
  card.setAttribute('aria-label', '播放 ' + ep.title);

  const art = document.createElement('div');
  art.className = 'ep-art';
  if (ep.cover){
    const img = document.createElement('img');
    img.referrerPolicy = 'no-referrer';
    img.loading = 'lazy';
    img.src = ep.cover;
    img.alt = '';
    img.onerror = function(){ art.textContent = '♪'; };
    art.appendChild(img);
  }else{
    art.textContent = '♪';
  }

  const info = document.createElement('div');
  info.className = 'ep-info';
  const name = document.createElement('p');
  name.className = 'ep-name';
  name.textContent = ep.title;
  const meta = document.createElement('p');
  meta.className = 'ep-meta';
  meta.textContent = [isRandom ? '随机播放中' : '', ep.show, ep.date, ep.duration].filter(Boolean).join(' · ');
  info.appendChild(name); info.appendChild(meta);

  const btn = document.createElement('span');
  btn.className = 'ep-btn';
  btn.innerHTML = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 4l14 8-14 8z"/></svg>';

  card.appendChild(art); card.appendChild(info); card.appendChild(btn);
  if (current && current.url === ep.audio) card.classList.add('playing');

  card.addEventListener('click', function(){ playEpisode(ep, card); });
  card.addEventListener('keydown', function(ev){
    if (ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); playEpisode(ep, card); }
  });
  return card;
}

function renderBlog(){
  if (!blogData) return;
  const q = input.value.trim().toLowerCase();
  let list = flattenEpisodes();
  if (q) list = list.filter(function(ep){ return (ep.title + ' ' + ep.show).toLowerCase().indexOf(q) >= 0; });

  blogList.innerHTML = '';
  blogCount.textContent = list.length ? '共 ' + list.length + ' 期 · 显示 ' + Math.min(blogLimit, list.length) : '';
  blogTitle.textContent = '最新节目';

  if (!list.length){
    blogState.hidden = false;
    blogState.innerHTML = '<p>没有找到节目</p><small>换个关键词或少选一个节目试试</small>';
    return;
  }
  blogState.hidden = true;

  const frag = document.createDocumentFragment();
  // 随机播放的那一期单独置顶，方便看到在放什么
  if (randomEp){
    frag.appendChild(makeEpCard(randomEp, true));
    list = list.filter(function(ep){ return ep.audio !== randomEp.audio; });
  }
  list.slice(0, blogLimit).forEach(function(ep){ frag.appendChild(makeEpCard(ep)); });
  blogList.appendChild(frag);

  if (list.length > blogLimit){
    const more = document.createElement('button');
    more.className = 'more-btn';
    more.type = 'button';
    more.textContent = '加载更多（还有 ' + (list.length - blogLimit) + ' 期）';
    more.addEventListener('click', function(ev){
      ev.stopPropagation();
      blogLimit += 10;
      renderBlog();
    });
    blogList.appendChild(more);
  }
}

function shufflePlay(){
  const list = flattenEpisodes();
  if (!list.length) return;
  let pick = null;
  for (let i = 0; i < 12; i++){
    const cand = list[Math.floor(Math.random() * list.length)];
    if (!current || cand.audio !== current.url){ pick = cand; break; }
  }
  if (!pick) pick = list[Math.floor(Math.random() * list.length)];
  randomEp = pick;
  const btn = document.getElementById('shuffleBtn');
  btn.classList.add('playing');
  document.getElementById('shuffleLabel').textContent = '换一期';
  renderBlog();
  const target = Array.prototype.find.call(blogList.querySelectorAll('.ep'), function(c){
    return c.getAttribute('aria-label') === '播放 ' + pick.title;
  });
  playEpisode(pick, target, true);
  toast('随机播放：' + pick.show + ' · ' + pick.title);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

document.getElementById('shuffleBtn').addEventListener('click', shufflePlay);

blogChips.addEventListener('click', function(ev){
  const b = ev.target.closest('.chip');
  if (!b) return;
  blogShow = b.dataset.show;
  blogLimit = 10;
  this.querySelectorAll('.chip').forEach(function(c){ c.classList.toggle('active', c === b); });
  renderBlog();
});

/* ===== 电台随机播放 ===== */
const randBtn = document.getElementById('randBtn');
const randLabel = document.getElementById('randLabel');

function resetRandUI(){
  if (!randBtn) return;
  randBtn.classList.remove('playing');
  randLabel.textContent = '随机播放';
}

function shuffleStation(){
  const list = stations && stations.length ? stations : pool;
  if (!list.length) return;
  let pick = null;
  for (let i = 0; i < 12; i++){
    const cand = list[Math.floor(Math.random() * list.length)];
    if (!current || cand.url !== current.url){ pick = cand; break; }
  }
  if (!pick) pick = list[Math.floor(Math.random() * list.length)];
  randBtn.classList.add('playing');
  randLabel.textContent = '换一台';
  play(pick);
  toast('随机播放：' + pick.name);
  const item = elMap.get(pick.url);
  if (item && item.card && typeof item.card.scrollIntoView === 'function'){
    item.card.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }
}

randBtn.addEventListener('click', shuffleStation);

/* ===== 分类筛选 ===== */
document.getElementById('chips').addEventListener('click', function(ev){
  const btn = ev.target.closest('.chip');
  if (!btn) return;
  filterKey = btn.dataset.key || '';
  this.querySelectorAll('.chip').forEach(function(c){ c.classList.toggle('active', c === btn); });
  if (!input.value.trim()) listTitle.textContent = filterLabel();
  render(pool);
  renderResume();
});

/* ===== 睡眠定时 ===== */
let sleepAt = 0, sleepTimer = null, sleepTick = null;
const sleepBtn = document.getElementById('sleepBtn');
const sleepPop = document.getElementById('sleepPop');
const sleepBadge = document.getElementById('sleepBadge');

function sleepRemain(){
  if (!sleepAt) return 0;
  return Math.max(0, Math.round((sleepAt - Date.now()) / 60000));
}
function updateSleepUI(){
  const left = sleepRemain();
  sleepBtn.classList.toggle('active', !!left);
  if (left){ sleepBadge.hidden = false; sleepBadge.textContent = left > 99 ? '99' : String(left); }
  else sleepBadge.hidden = true;
  sleepPop.querySelectorAll('button').forEach(function(b){
    const m = Number(b.dataset.min);
    b.classList.toggle('active', m === 0 ? !sleepAt : (!!sleepAt && sleepRemain() <= m && sleepRemain() > m - 1));
  });
}
function setSleep(minutes){
  clearTimeout(sleepTimer);
  clearInterval(sleepTick);
  if (!minutes){
    sleepAt = 0; updateSleepUI(); toast('已关闭睡眠定时'); return;
  }
  sleepAt = Date.now() + minutes * 60000;
  sleepTimer = setTimeout(function(){
    sleepAt = 0;
    wantPlaying = false;
    if (!audio.paused) audio.pause();
    updateSleepUI();
    toast('睡眠定时到，已停止播放');
  }, minutes * 60000);
  sleepTick = setInterval(updateSleepUI, 30000);
  updateSleepUI();
  toast('将在 ' + minutes + ' 分钟后停止播放');
}

sleepBtn.addEventListener('click', function(ev){
  ev.stopPropagation();
  themePop.hidden = true;
  sleepPop.hidden = !sleepPop.hidden;
  sleepBtn.setAttribute('aria-expanded', String(!sleepPop.hidden));
  updateSleepUI();
});
sleepPop.addEventListener('click', function(ev){
  const b = ev.target.closest('button');
  if (!b) return;
  setSleep(Number(b.dataset.min));
  sleepPop.hidden = true;
  sleepBtn.setAttribute('aria-expanded', 'false');
});
document.addEventListener('click', function(ev){
  if (!sleepPop.hidden && !sleepPop.contains(ev.target)) sleepPop.hidden = true;
});

/* ===== 最近收听 ===== */
const RECENT_KEY = 'radio_recent_v1';
let recent = (function(){
  try{
    const a = JSON.parse(localStorage.getItem(RECENT_KEY) || '[]');
    if (!Array.isArray(a)) return [];
    return a.map(function(x){
      if (!x) return null;
      return { n:x.n || x.name, u:x.u || x.url, f:x.f || x.fav || '', c:x.c || x.country || '', t:x.t || x.tag || '', h:x.h || (x.hls ? 1 : 0), k:x.k || x.clicks || 0, at:x.at || 0 };
    }).filter(function(x){ return x && x.n && x.u; }).slice(0, 5);
  }catch(e){ return []; }
})();

function remember(s){
  if (!s || !s.url) return;
  const item = { n:s.name, u:s.url, f:s.fav || '', c:s.country || '', t:s.tag || '', h:s.hls ? 1 : 0, k:s.clicks || 0, at:Date.now() };
  recent = [item].concat(recent.filter(function(r){ return r.u !== s.url; })).slice(0, 5);
  try{ localStorage.setItem(RECENT_KEY, JSON.stringify(recent)); }catch(e){}
  renderResume();
}

function agoText(ts){
  const d = Math.floor((Date.now() - ts) / 60000);
  if (!ts || d < 1) return '刚刚';
  if (d < 60) return d + ' 分钟前';
  const h = Math.floor(d / 60);
  if (h < 24) return h + ' 小时前';
  const day = Math.floor(h / 24);
  return day < 30 ? day + ' 天前' : '';
}

function renderResume(){
  const box = document.getElementById('resume');
  if (!box) return;
  const last = recent[0];
  if (!last || favOnly || filterKey || input.value.trim() || (current && current.url === last.u)){ box.hidden = true; return; }
  box.hidden = false;
  document.getElementById('resumeName').textContent = last.n;
  const c = COUNTRY[last.c] || last.c || '';
  const t = TAG[last.t] || '';
  document.getElementById('resumeMeta').textContent = ['继续收听', c, t, agoText(last.at)].filter(Boolean).join(' · ');
  const art = document.getElementById('resumeArt');
  if (last.f) art.innerHTML = '<img src="' + last.f + '" alt="" loading="lazy" onerror="this.remove()">';
  else art.textContent = (last.n || '?').trim().slice(0, 1);
}

document.getElementById('resumeBtn').setAttribute('aria-label', '继续收听上一台电台');
document.getElementById('resumeBtn').addEventListener('click', function(){
  const last = recent[0];
  if (!last) return;
  play({ name:last.n, url:last.u, fav:last.f, country:last.c, tag:last.t, hls:!!last.h, clicks:last.k, alts:[] });
});

/* ===== 系统媒体控制：锁屏 / 耳机线控 / 控制中心 ===== */
function updateMediaSession(s){
  if (!('mediaSession' in navigator)) return;
  try{
    if (!s){ navigator.mediaSession.metadata = null; return; }
    const m = metaText(s);
    navigator.mediaSession.metadata = new window.MediaMetadata({
      title: s.name,
      artist: [m.c, m.t].filter(Boolean).join(' · ') || '网络电台',
      album: '网络电台',
      artwork: s.fav ? [{ src: s.fav, sizes: '512x512' }] : []
    });
  }catch(e){}
}

function setupMediaSession(){
  if (!('mediaSession' in navigator)) return;
  try{
    navigator.mediaSession.setActionHandler('play', function(){ if (current) resumeOrReconnect(); });
    navigator.mediaSession.setActionHandler('pause', function(){ wantPlaying = false; audio.pause(); });
    navigator.mediaSession.setActionHandler('stop', function(){ wantPlaying = false; audio.pause(); });
    navigator.mediaSession.setActionHandler('previoustrack', function(){ stepStation(-1); });
    navigator.mediaSession.setActionHandler('nexttrack', function(){ stepStation(1); });
  }catch(e){}
}

function stepStation(d){
  if (!stations.length) return;
  let i = -1;
  if (current) i = stations.findIndex(function(x){ return x.url === current.url; });
  if (i < 0) i = d > 0 ? -1 : 0;
  const n = stations.length;
  const next = stations[(((i + d) % n) + n) % n];
  if (next && next.url !== (current && current.url)) play(next);
}

/* ===== 键盘快捷键：空格 播放/暂停，/ 聚焦搜索，Esc 清空 ===== */
document.addEventListener('keydown', function(e){
  const t = e.target;
  const typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable);
  if (typing){
    if (e.key === 'Escape' && t === input){
      input.value = '';
      clearBtn.classList.remove('show');
      lastQuery = '';
      clearTimeout(searchTimer);
      input.blur();
      loadDefault();
    }
    return;
  }
  if (e.key === ' ' || e.code === 'Space'){
    e.preventDefault();
    if (!current){
      const first = stations[0] || pool[0];
      if (first) play(first);
    } else if (audio.paused){
      resumeOrReconnect();
    } else {
      wantPlaying = false;
      audio.pause();
    }
    return;
  }
  if (e.key === '/'){ e.preventDefault(); input.focus(); return; }
  if (e.key === 'Escape'){
    if (favOnly){ favOnly = false; updateFavMarks(); loadDefault(); }
    else if (input.value){
      input.value = '';
      clearBtn.classList.remove('show');
      lastQuery = '';
      clearTimeout(searchTimer);
      loadDefault();
    }
  }
});

/* ===== 启动：有缓存先上缓存，没有再用内置数据 ===== */
const bootCache = readCache();
pool = mergeMine(bootCache ? dedupe(bootCache) : dedupe(SEED.map(norm)));
render(pool, true);
setNowPlaying(null);
updateFavMarks();
renderResume();
setupMediaSession();
loadDefault();

/* 添加到主屏 / 离线可用：仅 https 或本机调试时注册 */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
