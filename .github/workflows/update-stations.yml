name: 更新电台与播客

on:
  schedule:
    - cron: '0 20 * * *'      # 每天 20:00 UTC（北京时间次日 4:00）
  workflow_dispatch:            # 也可以手动点一下立即更新

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 生成电台清单
        run: |
          if [ -f scripts/build_stations.py ]; then
            python3 scripts/build_stations.py
          else
            python3 build_stations.py
          fi

      - name: 生成播客节目单
        run: |
          if [ -f scripts/build_blog.py ]; then
            python3 scripts/build_blog.py
          else
            python3 build_blog.py
          fi

      - name: 提交变更
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add stations.json blog.json
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "chore: 更新电台与播客内容"
            git push
          fi
#（注：内容由AI生成）
